[project]
name = "litmatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.11.15",
    "dagster-dg-cli>=1.11.15",
    "dagster-webserver>=1.11.15",
    "fastapi[standard]>=0.128.5",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "sentence-transformers>=3.0.0",
    "sqlalchemy>=2.0.14,<2.1.0",
    "sqlmodel>=0.0.27",
    "torch>=2.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires running containers)",
]
testpaths = ["tests"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "litmatch"
registry_modules = [
    "litmatch.components.*",
]


