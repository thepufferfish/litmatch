services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dagster-db.sh:/docker-entrypoint-initdb.d/init-dagster-db.sh:Z,ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth/refresh}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  scrapyd:
    build:
      context: ./scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROXY_TOKEN: ${PROXY_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:6800:6800"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6800/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    image: litmatch-dagster:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      scrapyd:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DAGSTER_STORAGE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      SCRAPYD_URL: http://scrapyd:6800
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_GRPC_TIMEOUT_SECONDS: "180"
    healthcheck:
      test: ["CMD", "uv", "run", "dagster", "api", "grpc-health-check", "--port", "4000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dagster-webserver:
    image: litmatch-dagster:local
    entrypoint: ["/usr/local/bin/wait-for-dagster-code.sh"]
    command: ["uv", "run", "dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/dagster_home/workspace.yaml"]
    restart: unless-stopped
    depends_on:
      dagster-code:
        condition: service_healthy
    environment:
      DAGSTER_STORAGE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_GRPC_TIMEOUT_SECONDS: "180"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  dagster-daemon:
    image: litmatch-dagster:local
    entrypoint: ["/usr/local/bin/wait-for-dagster-code.sh"]
    command: ["uv", "run", "dagster-daemon", "run"]
    restart: unless-stopped
    depends_on:
      dagster-code:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DAGSTER_STORAGE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      SCRAPYD_URL: http://scrapyd:6800
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_GRPC_TIMEOUT_SECONDS: "180"
      DAGSTER_SENSOR_GRPC_TIMEOUT_SECONDS: "180"
    healthcheck:
      test: ["CMD", "uv", "run", "dagster-daemon", "liveness-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
