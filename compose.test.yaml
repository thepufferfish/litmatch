# Compose override for integration tests.
#
# Usage:
#   podman compose -f compose.yaml -f compose.test.yaml --env-file .env up --build -d
#
# Differences from production compose:
#   - Uses separate test volumes (postgres_data_test)
#   - Uses a unique project name via COMPOSE_PROJECT_NAME=litmatch-test
#   - No frontend or scrapyd services (not needed for integration tests)
#   - SCRAPYD_URL points to unreachable host so startup_crawl_sensor stays idle
#   - Test fixture data is seeded into the staging table by conftest.py

services:
  # Override DB to use separate test volume
  db:
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
      - ./init-dagster-db.sh:/docker-entrypoint-initdb.d/init-dagster-db.sh:ro

  # Override backend (same image, test-isolated DB)
  backend:
    depends_on:
      db:
        condition: service_healthy

  # Disable services not needed for integration tests
  frontend:
    profiles: ["disabled"]

  scrapyd:
    profiles: ["disabled"]

  # Override dagster-code to remove scrapyd dependency
  dagster-code:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DAGSTER_STORAGE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      SCRAPYD_URL: http://scrapyd-disabled:6800
      DAGSTER_HOME: /opt/dagster/dagster_home

  dagster-webserver:
    environment:
      DAGSTER_STORAGE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster

  dagster-daemon:
    depends_on:
      dagster-code:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DAGSTER_STORAGE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/dagster
      SCRAPYD_URL: http://scrapyd-disabled:6800
      DAGSTER_HOME: /opt/dagster/dagster_home

volumes:
  postgres_data_test:
