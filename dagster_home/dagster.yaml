# Dagster instance config for containerized deployment.
# Uses a dedicated PostgreSQL database (not the application DB) to avoid
# schema collisions.  The root dagster.yaml is kept for local `dg dev`.

storage:
  postgres:
    postgres_url:
      env: DAGSTER_STORAGE_URL

# Use DefaultRunCoordinator so the webserver launches runs directly,
# bypassing the daemon's queued dequeue loop.  QueuedRunCoordinator
# causes DagsterCodeLocationNotFoundError when the daemon's gRPC
# connection to the code server lapses under load.
run_coordinator:
  module: dagster._core.run_coordinator.sync_in_memory_run_coordinator
  class: SyncInMemoryRunCoordinator

sensors:
  use_threads: true
  num_workers: 4

python_logs:
  managed_python_loggers:
    - sqlalchemy.engine
